<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabuil 基礎英語長文_Taku</title>
  <style>
    :root {
      --bg-dark: #060913;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(0, 242, 254, 0.2);
      --accent-neon-blue: #00f2fe;
      --accent-neon-purple: #9d4edd;
      --accent-green: #00ff87;
      --accent-red: #ff0055;
      --text-main: #f8fafc;
      --text-sub: #64748b;
      --badge-a2: #38ef7d;
      --badge-b1: #00f2fe;
      --badge-b2: #ffb347;
      --badge-c1: #ff416c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body {
      background: radial-gradient(circle at 50% 10%, #1e1b4b, #090d16 60%, #030712);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: 
        linear-gradient(rgba(0, 242, 254, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
      z-index: 0;
    }

    header, .card-container, .quiz-container, .nav-buttons, .action-buttons {
      position: relative;
      z-index: 1;
    }

    header {
      width: 100%;
      max-width: 480px;
      margin-bottom: 6px;
      text-align: center;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 900;
      background: linear-gradient(135deg, #ff0055, #ff4d6d, #ff758f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      letter-spacing: 1px;
      line-height: 1.2;
      text-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
    }

    .title-taku {
      font-size: 0.65em;
      font-weight: 600;
      opacity: 0.9;
    }

    .dashboard {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.36);
    }

    .circle-chart { position: relative; width: 40px; height: 40px; }
    .circle-chart svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .circle-bg { fill: none; stroke: rgba(255, 255, 255, 0.05); stroke-width: 4; }
    .circle-progress { fill: none; stroke: url(#gradient); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 0, 100; transition: stroke-dasharray 0.6s ease; }
    .percentage { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 0.7rem; font-weight: 900; color: var(--accent-neon-blue); }
    .dash-info { text-align: right; }
    .dash-info div { font-size: 0.7rem; color: var(--text-sub); margin-bottom: 1px; }
    .dash-info span { font-size: 0.9rem; font-weight: bold; color: var(--text-main); }

    .view-switcher { width: 100%; max-width: 480px; display: flex; gap: 8px; margin-bottom: 6px; }
    .tab-btn { flex: 1; padding: 6px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--card-border); border-radius: 8px; color: var(--text-sub); font-weight: 700; font-size: 0.78rem; cursor: pointer; transition: all 0.3s; }
    .tab-btn.active { background: linear-gradient(135deg, var(--accent-neon-blue), var(--accent-neon-purple)); color: #fff; border-color: transparent; box-shadow: 0 0 15px rgba(0, 242, 254, 0.4); }

    .controls { width: 100%; max-width: 480px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
    select, button.icon-btn { background: rgba(15, 23, 42, 0.7); border: 1px solid var(--card-border); color: var(--text-main); padding: 6px 8px; border-radius: 8px; font-size: 0.75rem; outline: none; backdrop-filter: blur(10px); transition: all 0.3s ease; width: 100%; }
    select { cursor: pointer; }
    select option { background: #0f172a; color: white; }
    button.icon-btn { cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; font-weight: bold; }
    button.icon-btn:hover { border-color: var(--accent-neon-blue); box-shadow: 0 0 12px rgba(0, 242, 254, 0.3); }
    
    .toggle-btn {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 8px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.3s;
    }
    .toggle-btn.active {
      border-color: var(--accent-green);
      color: var(--accent-green);
      box-shadow: 0 0 10px rgba(0, 255, 135, 0.25);
    }
    .toggle-btn.off {
      border-color: rgba(255,255,255,0.1);
      color: var(--text-sub);
      opacity: 0.6;
    }

    .autoplay-active { background: linear-gradient(135deg, #00f2fe, #9d4edd) !important; color: #fff !important; box-shadow: 0 0 15px rgba(0, 242, 254, 0.5) !important; border: none !important; }

    .card-container { width: 100%; max-width: 480px; height: 260px; perspective: 1000px; cursor: pointer; margin-bottom: 6px; }
    .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); border-radius: 20px; }
    .card.flipped { transform: rotateY(180deg); }
    .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 20px; background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--card-border); padding: 14px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.03); }
    .card-back { transform: rotateY(180deg); }

    .badge { padding: 3px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    .badge.A2\+ { background: var(--badge-a2); color: #000; }
    .badge.B1 { background: var(--badge-b1); color: #000; }
    .badge.B2 { background: var(--badge-b2); color: #000; }
    .badge.C1 { background: var(--badge-c1); color: #fff; }

    .en-word { 
      font-size: 2.1rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #fff; 
      text-align: center; 
      text-shadow: 0 0 20px rgba(0, 242, 254, 0.6); 
      word-wrap: break-word;
    }
    .ja-word { 
      font-size: 1.3rem; 
      font-weight: 800; 
      color: var(--accent-green); 
      text-align: center; 
      text-shadow: 0 0 15px rgba(0, 255, 135, 0.4);
    }
    
    .word-hint {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.85rem;
      color: var(--accent-neon-purple);
      margin-top: 4px;
      text-align: center;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* IPA (国際音声記号) 用フォント設定 */
    .phonetic { 
      font-family: "Gentium Plus", "Charis SIL", "Doulos SIL", "Lucida Sans Unicode", "DejaVu Sans", "Arial Unicode MS", "Courier New", monospace; 
      font-size: 0.95rem; 
      color: #a5b4fc; 
      margin-top: 2px; 
      text-align: center; 
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    
    .pos { font-size: 0.8rem; color: var(--accent-neon-blue); font-style: italic; margin-top: 2px; text-align: center; }

    .example-box { background: rgba(0, 0, 0, 0.4); border-left: 3px solid var(--accent-neon-blue); padding: 8px 10px; border-radius: 6px; width: 100%; font-size: 0.75rem; line-height: 1.35; color: #cbd5e1; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
    .example-src { display: block; font-size: 0.65rem; color: var(--text-sub); margin-top: 2px; font-weight: 600; }
    
    .speaker-btn { background: rgba(0, 242, 254, 0.1); border: 1px solid var(--card-border); color: var(--accent-neon-blue); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .speaker-btn:hover { background: var(--accent-neon-blue); color: #000; box-shadow: 0 0 15px var(--accent-neon-blue); }

    .quiz-container { width: 100%; max-width: 480px; background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--card-border); border-radius: 20px; padding: 14px; display: none; flex-direction: column; align-items: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); margin-bottom: 6px; height: 260px; justify-content: space-between; }
    .quiz-question { margin-bottom: 10px; text-align: center; width: 100%; word-wrap: break-word; }
    .en-word-quiz { font-size: 1.8rem; font-weight: 900; color: #fff; text-shadow: 0 0 15px rgba(0, 242, 254, 0.5); }
    .ja-word-quiz { font-size: 1.3rem; font-weight: 800; color: var(--accent-green); text-shadow: 0 0 15px rgba(0, 255, 135, 0.4); }

    .options-grid { width: 100%; display: grid; grid-template-columns: 1fr; gap: 6px; }
    .option-btn { padding: 8px 12px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--card-border); border-radius: 10px; color: var(--text-main); font-size: 0.8rem; font-weight: 600; text-align: left; cursor: pointer; transition: all 0.2s; }
    .option-btn:hover { background: rgba(0, 242, 254, 0.1); border-color: var(--accent-neon-blue); }
    .option-btn.correct { background: rgba(0, 255, 135, 0.25) !important; border-color: var(--accent-green) !important; color: var(--accent-green) !important; box-shadow: 0 0 15px rgba(0, 255, 135, 0.4); }
    .option-btn.wrong { background: rgba(255, 0, 85, 0.25) !important; border-color: var(--accent-red) !important; color: var(--accent-red) !important; }

    .nav-buttons { width: 100%; max-width: 480px; display: flex; gap: 8px; margin-bottom: 6px; }
    .nav-btn { flex: 1; padding: 6px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--card-border); border-radius: 8px; color: var(--text-main); font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; }
    .nav-btn:hover { background: rgba(0, 242, 254, 0.15); border-color: var(--accent-neon-blue); }

    .action-buttons { width: 100%; max-width: 480px; display: flex; gap: 10px; }
    .action-btn { flex: 1; padding: 8px; border: none; border-radius: 10px; font-size: 0.8rem; font-weight: 800; cursor: pointer; color: #fff; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .btn-gotit { background: linear-gradient(135deg, #00ff87, #00f2fe); color: #000; box-shadow: 0 4px 15px rgba(0, 255, 135, 0.4); }
    .action-btn:active { transform: scale(0.96); }
    .hint { font-size: 0.65rem; color: var(--text-sub); }
  </style>
</head>
<body>

  <header>
    <h1>Vocabuil 基礎英語長文_<span class="title-taku">Taku</span></h1>
    
    <div class="dashboard">
      <div class="circle-chart">
        <svg viewBox="0 0 36 36">
          <defs>
            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00f2fe" />
              <stop offset="100%" stop-color="#00ff87" />
            </linearGradient>
          </defs>
          <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          <path class="circle-progress" id="circleProgress" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
        </svg>
        <div class="percentage" id="percentText">0%</div>
      </div>
      <div class="dash-info">
        <div>カード進捗</div>
        <div><span id="currentCardNum">0</span> / <span id="totalCardNum">0</span></div>
        <div style="margin-top:1px;">習得済み: <span id="masteredCount" style="color:var(--accent-green);">0</span> 語</div>
      </div>
    </div>

    <div class="view-switcher">
      <button class="tab-btn active" id="cardTab" onclick="switchView('card')">Flashcard</button>
      <button class="tab-btn" id="quizTab" onclick="switchView('quiz')">4択 Quiz</button>
    </div>

    <div class="controls">
      <select id="lessonFilter" onchange="filterCards()">
        <option value="ALL">すべての長文 (1〜40)</option>
        <option value="1-10">長文 1 〜 10</option>
        <option value="11-20">長文 11 〜 20</option>
        <option value="21-30">長文 21 〜 30</option>
        <option value="31-40">長文 31 〜 40</option>
      </select>

      <select id="modeSelect" onchange="if(currentView==='card'){ updateCard(); } else { setupQuiz(); }">
        <option value="EN_JA">英 ➔ 日 モード</option>
        <option value="JA_EN">日 ➔ 英 モード</option>
      </select>

      <select id="levelFilter" onchange="filterCards()">
        <option value="ALL">すべてのレベル (A2+〜C1)</option>
        <option value="A2+">CEFR A2+</option>
        <option value="B1">CEFR B1</option>
        <option value="B2">CEFR B2</option>
        <option value="C1">CEFR C1</option>
      </select>

      <select id="speedSelect" onchange="if(isAutoplay) startAutoplaySequence();">
        <option value="1000">Pause: 1秒 (爆速)</option>
        <option value="3000" selected>Pause: 3秒</option>
        <option value="5000">Pause: 5秒</option>
        <option value="7000">Pause: 7秒</option>
      </select>

      <select id="voiceSelect" style="grid-column: span 2;">
        <option value="en-US">音声: アメリカ英語 (US)</option>
        <option value="en-GB">音声: イギリス英語 (UK)</option>
        <option value="en-AU">音声: オーストラリア英語 (AU)</option>
      </select>

      <button class="toggle-btn active" id="audioToggleBtn" onclick="toggleAudio()">読み上げ ON</button>
      <button class="toggle-btn off" id="shuffleToggleBtn" onclick="toggleShuffle()">シャッフル OFF</button>

      <button class="icon-btn" id="autoplayBtn" onclick="toggleAutoplay()" style="grid-column: span 2;">Auto Play</button>
    </div>
  </header>

  <div class="card-container" id="cardView" onclick="manualFlipCard()">
    <div class="card" id="card">
      <div class="card-front">
        <span class="badge" id="frontBadge">B1</span>
        <div id="frontContent" style="width: 100%;">
          <div class="en-word" id="frontTitle">Word</div>
          <div class="word-hint" id="frontHint" style="display:none;">Hint: f _ _ _ _ (5 letters)</div>
          <div class="phonetic" id="frontPhonetic">/wɜːd/</div>
          <div class="pos" id="frontSub">品詞</div>
        </div>
        <button class="speaker-btn" onclick="speakSide(event, 'front')">音声</button>
        <div class="hint">Tap or [Space] to flip</div>
      </div>
      <div class="card-back">
        <span class="badge" id="backBadge">B1</span>
        <div id="backContent" style="width:100%; display:flex; flex-direction:column; align-items:center;">
          <div class="ja-word" id="backTitle" style="margin-bottom:2px;">日本語訳</div>
          <div class="phonetic" id="backPhonetic" style="display:none; margin-bottom:4px;"></div>
          <div class="example-box" style="margin-top:4px;">
            <span id="backExample">例文がここに表示されます。</span>
            <span class="example-src" id="backSrc">出典: 1</span>
          </div>
        </div>
        <button class="speaker-btn" style="margin-top:4px;" onclick="speakSide(event, 'back')">音声</button>
        <div class="hint">Tap or [Space] to flip</div>
      </div>
    </div>
  </div>

  <div class="quiz-container" id="quizView">
    <div style="width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <span class="badge" id="quizBadge">B1</span>
      <button class="speaker-btn" style="width:28px; height:28px; font-size:0.8rem;" onclick="speakSide(event, 'front')">音声</button>
    </div>
    <div class="quiz-question en-word-quiz" id="quizQuestion">Question</div>
    <div class="options-grid" id="optionsGrid"></div>
  </div>

  <div class="nav-buttons">
    <button class="nav-btn" onclick="prevCard()">&lt; 前へ</button>
    <button class="nav-btn" onclick="nextCard()">次へ &gt;</button>
  </div>

  <div class="action-buttons" id="flashcardActions">
    <button class="action-btn btn-gotit" onclick="markCard(true)">覚えた</button>
  </div>

  <script>
    // IPA (International Phonetic Alphabet) 規格準拠データセット
    const vocabulary = [
      { id: 1, lesson: 1, word: "frequently", phonetic: "/ˈfriːkwəntli/", cefr: "A2+", pos: "副詞", meaning: "頻繁に、しばしば", src: "長文 1", example: "English newspapers in Japan frequently carry letters to the editor..." },
      { id: 2, lesson: 1, word: "recount", phonetic: "/rɪˈkaʊnt/", cefr: "C1", pos: "動詞", meaning: "詳しく語る、話す", src: "長文 1", example: "...recounting how objects lost in trains and public places are returned by Japanese individuals." },
      { id: 3, lesson: 1, word: "valuable", phonetic: "/ˈvæljuəbl/", cefr: "B1", pos: "形容詞", meaning: "貴重な、価値のある", src: "長文 1", example: "Once I left a valuable document in a taxi." },
      { id: 4, lesson: 1, word: "promptly", phonetic: "/ˈprɒmptli/", cefr: "A2+", pos: "副詞", meaning: "即座に、迅速に", src: "長文 1", example: "It, too, was returned promptly, and nothing was missing." },
      { id: 5, lesson: 1, word: "overlook", phonetic: "/ˌəʊvəˈlʊk/", cefr: "A2+", pos: "動詞", meaning: "見落とす、見逃す", src: "長文 1", example: "Such cases are not overlooked by grateful foreigners." },
      { id: 6, lesson: 1, word: "grateful", phonetic: "/ˈɡreɪtfl/", cefr: "B1", pos: "形容詞", meaning: "感謝している", src: "長文 1", example: "Such cases are not overlooked by grateful foreigners." },
      { id: 7, lesson: 1, word: "rack", phonetic: "/ræk/", cefr: "B1", pos: "名詞", meaning: "棚、網棚", src: "長文 1", example: "One would never think of putting one’s briefcase in the overhead rack in an American or European train." },
      { id: 8, lesson: 1, word: "neglect", phonetic: "/nɪˈɡlekt/", cefr: "A2+", pos: "動詞", meaning: "怠る、放置する", src: "長文 1", example: "Japanese going abroad should be careful not to neglect their possessions for even a short while." },
      { id: 9, lesson: 1, word: "possession", phonetic: "/pəˈzeʃn/", cefr: "A2+", pos: "名詞", meaning: "所有物、所持品", src: "長文 1", example: "...not to neglect their possessions for even a short while." },
      { id: 10, lesson: 1, word: "inconvenience", phonetic: "/ˌɪnkənˈviːniəns/", cefr: "A2+", pos: "名詞", meaning: "不便、迷惑", src: "長文 1", example: "Several of my Japanese friends have had their valuables stolen abroad, to their great inconvenience." },
      { id: 11, lesson: 1, word: "embassy", phonetic: "/ˈembəsi/", cefr: "A2+", pos: "名詞", meaning: "大使館", src: "長文 1", example: "Japanese embassies often handle such cases of theft." },
      { id: 12, lesson: 1, word: "evade", phonetic: "/ɪˈveɪd/", cefr: "B2", pos: "動詞", meaning: "（税金などを）逃れる、回避する", src: "長文 1", example: "...giving the number of doctors, dentists, and landowners attempting to evade taxes." },
      { id: 13, lesson: 2, word: "opportunity", phonetic: "/ˌɒpəˈtjuːnəti/", cefr: "B1", pos: "名詞", meaning: "機会、チャンス", src: "長文 2", example: "Reading is an endless opportunity, an ever-open door to ever-greater mental growth." },
      { id: 14, lesson: 2, word: "surrender", phonetic: "/səˈrendə(r)/", cefr: "B2", pos: "動詞", meaning: "（〜に）屈する、身を任せる", src: "長文 2", example: "...or you must surrender yourself to self-chosen ignorance." },
      { id: 15, lesson: 2, word: "ignorance", phonetic: "/ˈɪɡnərəns/", cefr: "B1", pos: "名詞", meaning: "無知", src: "長文 2", example: "...or you must surrender yourself to self-chosen ignorance." },
      { id: 16, lesson: 2, word: "requirement", phonetic: "/rɪˈkwaɪəmənt/", cefr: "B1", pos: "名詞", meaning: "必要条件、必修", src: "長文 2", example: "...(unless reading it is a requirement to pass an examination, or something like that)." },
      { id: 17, lesson: 2, word: "devote", phonetic: "/dɪˈvəʊt/", cefr: "B1", pos: "動詞", meaning: "（時間・労力を）捧げる、充てる", src: "長文 2", example: "...put it back on the shelf and devote your time instead to reading something else..." },
      { id: 18, lesson: 2, word: "confess", phonetic: "/kənˈfes/", cefr: "B1", pos: "動詞", meaning: "認める、告白する", src: "長文 2", example: "...be fair with yourself and confess that perhaps the shortcoming is not in the book but in you." },
      { id: 19, lesson: 2, word: "shortcoming", phonetic: "/ˈʃɔːtkʌmɪŋ/", cefr: "A2+", pos: "名詞", meaning: "欠点、短所", src: "長文 2", example: "...confess that perhaps the shortcoming is not in the book but in you." },
      { id: 20, lesson: 2, word: "dull", phonetic: "/dʌl/", cefr: "B1", pos: "形容詞", meaning: "退屈な、冴えない", src: "長文 2", example: "Often a book which now seems dull or difficult will prove easy to grasp and fascinating to read..." },

      { id: 110, lesson: 24, word: "drudgery", phonetic: "/ˈdrʌdʒəri/", cefr: "A2+", pos: "名詞", meaning: "単調で辛い仕事", src: "長文 24", example: "Most of the idle rich suffer unspeakable boredom as the price of their freedom from drudgery." },

      { id: 112, lesson: 25, word: "overtaxed", phonetic: "/ˌəʊvəˈtækst/", cefr: "B2", pos: "形容詞", meaning: "酷使された、負荷がかかりすぎた", src: "長文 25", example: "Also, when we’re worried or overtaxed, a habit comforts us." },
      { id: 113, lesson: 25, word: "numb", phonetic: "/nʌm/", cefr: "B2", pos: "形容詞", meaning: "麻痺した、無感覚な", src: "長文 25", example: "Habit makes it dangerously easy to become numb to our own existence." },
      { id: 114, lesson: 27, word: "solitude", phonetic: "/ˈsɒlətjuːd/", cefr: "B2", pos: "名詞", meaning: "孤独（前向きな一人暮らし・一人の時間）", src: "長文 27", example: "How can the capacity for solitude be cultivated?" },
      { id: 115, lesson: 27, word: "reverie", phonetic: "/ˈrevəri/", cefr: "C1", pos: "名詞", meaning: "幻想、白昼夢", src: "長文 27", example: "...allowing the girl’s reverie with her bath toys as she makes up stories..." },
      { id: 116, lesson: 27, word: "impoverishment", phonetic: "/ɪmˈpɒvərɪʃmənt/", cefr: "C1", pos: "名詞", meaning: "窮困、貧困化、低下", src: "長文 27", example: "This reflects the impoverishment of our experience." },
      { id: 117, lesson: 28, word: "stereotype", phonetic: "/ˈsteriətaɪp/", cefr: "B2", pos: "名詞 / 動詞", meaning: "固定観念 / 固定観念で見なす", src: "長文 28", example: "“Speaking of cultural differences leads us to stereotype..." },
      { id: 118, lesson: 29, word: "intrinsic", phonetic: "/ɪnˈtrɪnzɪk/", cefr: "B2", pos: "形容詞", meaning: "内在的な、本質的な", src: "長文 29", example: "Some are intrinsic to the story itself: language artfully used..." },
      { id: 119, lesson: 29, word: "craftsmanship", phonetic: "/ˈkrɑːftsmənʃɪp/", cefr: "B2", pos: "名詞", meaning: "職人技、巧みな技術", src: "長文 29", example: "Intrinsic factors come from the writer’s craftsmanship and art." },
      { id: 120, lesson: 30, word: "consternation", phonetic: "/ˌkɒnstəˈneɪʃn/", cefr: "C1", pos: "名詞", meaning: "仰天、ひどい狼狽", src: "長文 30", example: "To his great consternation, he awoke to find an enormous snake staring at him..." },
      { id: 121, lesson: 30, word: "pernicious", phonetic: "/pəˈnɪʃəs/", cefr: "C1", pos: "形容詞", meaning: "有害な、致命的な", src: "長文 30", example: "One bite from such a serpent would prove not only painful but positively pernicious." },
      { id: 122, lesson: 30, word: "slither", phonetic: "/ˈslɪðə(r)/", cefr: "C1", pos: "動詞", meaning: "（蛇が）ずるずる滑る、はう", src: "長文 30", example: "Slowly the snake slithered forward toward him." },
      { id: 123, lesson: 30, word: "recoil", phonetic: "/rɪˈkɔɪl/", cefr: "C1", pos: "動詞", meaning: "（恐怖・驚きで）引き下がる", src: "長文 30", example: "His left leg recoiled instinctively as the viper’s tongue flicked out..." },
      { id: 124, lesson: 30, word: "sustenance", phonetic: "/ˈsʌstənəns/", cefr: "B2", pos: "名詞", meaning: "食料、生活の糧", src: "長文 30", example: "...not recognizing him as a potential source of sustenance..." },
      { id: 125, lesson: 30, word: "cascade", phonetic: "/kæsˈkeɪd/", cefr: "C1", pos: "動詞", meaning: "滝のように流れ落ちる", src: "長文 30", example: "The sweat was now cascading down his forehead..." },
      { id: 126, lesson: 30, word: "surreptitiously", phonetic: "/ˌsʌrəpˈtɪʃəsli/", cefr: "C1", pos: "副詞", meaning: "秘密裏に、こっそりと", src: "長文 30", example: "...as he reached surreptitiously for his trusty weapon." },
      { id: 127, lesson: 31, word: "uninhibited", phonetic: "/ˌʌnɪnˈhɪbɪtɪd/", cefr: "B2", pos: "形容詞", meaning: "抑圧のない、自由奔放な", src: "長文 31", example: "...traditional cultural rules dictate that women should not exhibit a wide, uninhibited smile." },
      { id: 128, lesson: 31, word: "disconcerting", phonetic: "/ˌdɪskənˈsɜːtɪŋ/", cefr: "C1", pos: "形容詞", meaning: "惑わせる、不安にさせる", src: "長文 31", example: "...and they find it quite disconcerting to speak to someone who is wearing dark sunglasses." },
      { id: 129, lesson: 33, word: "vacillation", phonetic: "/ˌvæsəˈleɪʃn/", cefr: "C1", pos: "名詞", meaning: "揺らぎ、優柔不断", src: "長文 33", example: "...hence a good deal of vacillation here and there." },
      { id: 130, lesson: 34, word: "apathetic", phonetic: "/ˌæpəˈθetɪk/", cefr: "B2", pos: "形容詞", meaning: "無関心な、冷淡な", src: "長文 34", example: "Peace of mind or a calm state of mind shouldn't confuse that with a totally apathetic state of mind." },
      { id: 131, lesson: 36, word: "phenomenon", phonetic: "/fəˈnɒmɪnən/", cefr: "B2", pos: "名詞", meaning: "現象", src: "長文 36", example: "An exploding lake is a strange phenomenon." },
      { id: 132, lesson: 38, word: "bemoan", phonetic: "/bɪˈməʊn/", cefr: "C1", pos: "動詞", meaning: "嘆き悲しむ、不満を言う", src: "長文 38", example: "The Japanese are loud in bemoaning their lack of proficiency in the English tongue." },
      { id: 133, lesson: 39, word: "innate", phonetic: "/ɪˈneɪt/", cefr: "B1", pos: "形容詞", meaning: "生まれつきの、天性の", src: "長文 39", example: "The ability to imitate must be innate." },
      { id: 134, lesson: 40, word: "bequeath", phonetic: "/bɪˈkwiːð/", cefr: "C1", pos: "動詞", meaning: "遺贈する、後世に残す", src: "長文 40", example: "...as she spoke openly about what she was going to bequeath to everyone." },
      { id: 135, lesson: 40, word: "deteriorate", phonetic: "/dɪˈtɪəriəreɪt/", cefr: "B1", pos: "動詞", meaning: "悪化する", src: "長文 40", example: "Her health was noticeably deteriorating, but she still had her wits about her." }
    ];

    let filteredList = [...vocabulary];
    let currentIndex = 0;
    let isFlipped = false;
    let isAutoplay = false;
    let isAudioEnabled = true;
    let isShuffleEnabled = false;
    let autoplayTimeoutId = null;
    let currentView = 'card';
    let availableVoices = [];
    let masteredIds = JSON.parse(localStorage.getItem("cefr_mastered_cyber_taku") || "[]");

    function initVoices() {
      if (typeof speechSynthesis === 'undefined') return;
      availableVoices = speechSynthesis.getVoices();
    }

    if (typeof speechSynthesis !== 'undefined') {
      speechSynthesis.onvoiceschanged = initVoices;
      setTimeout(initVoices, 300);
    }

    function toggleAudio() {
      isAudioEnabled = !isAudioEnabled;
      const btn = document.getElementById("audioToggleBtn");
      if (isAudioEnabled) {
        btn.innerText = "読み上げ ON";
        btn.classList.add("active");
        btn.classList.remove("off");
      } else {
        btn.innerText = "読み上げ OFF";
        btn.classList.remove("active");
        btn.classList.add("off");
        window.speechSynthesis.cancel();
      }
    }

    function toggleShuffle() {
      isShuffleEnabled = !isShuffleEnabled;
      const btn = document.getElementById("shuffleToggleBtn");
      if (isShuffleEnabled) {
        btn.innerText = "シャッフル ON";
        btn.classList.add("active");
        btn.classList.remove("off");
      } else {
        btn.innerText = "シャッフル OFF";
        btn.classList.remove("active");
        btn.classList.add("off");
      }
      filterCards();
    }

    function saveState() {
      localStorage.setItem("cefr_mastered_cyber_taku", JSON.stringify(masteredIds));
    }

    function switchView(view) {
      currentView = view;
      document.getElementById("cardTab").classList.toggle("active", view === 'card');
      document.getElementById("quizTab").classList.toggle("active", view === 'quiz');

      if (view === 'card') {
        document.getElementById("cardView").style.display = 'block';
        document.getElementById("quizView").style.display = 'none';
        document.getElementById("flashcardActions").style.display = 'flex';
        updateCard();
      } else {
        document.getElementById("cardView").style.display = 'none';
        document.getElementById("quizView").style.display = 'flex';
        document.getElementById("flashcardActions").style.display = 'none';
        setupQuiz();
      }
    }

    function updateCard() {
      if (filteredList.length === 0) {
        document.getElementById("frontTitle").innerText = "該当なし";
        document.getElementById("frontHint").style.display = "none";
        document.getElementById("frontPhonetic").innerText = "";
        document.getElementById("frontSub").innerText = "";
        document.getElementById("frontBadge").style.display = "none";
        document.getElementById("backTitle").innerText = "条件に合うカードがありません";
        document.getElementById("backPhonetic").style.display = "none";
        document.getElementById("backExample").innerText = "";
        document.getElementById("backSrc").innerText = "";
        document.getElementById("backBadge").style.display = "none";
        document.getElementById("currentCardNum").innerText = "0";
        document.getElementById("totalCardNum").innerText = "0";
        return;
      }

      document.getElementById("frontBadge").style.display = "inline-block";
      document.getElementById("backBadge").style.display = "inline-block";

      const item = filteredList[currentIndex];
      const mode = document.getElementById("modeSelect").value;
      const frontTitleEl = document.getElementById("frontTitle");
      const backTitleEl = document.getElementById("backTitle");
      const hintEl = document.getElementById("frontHint");

      if (mode === "EN_JA") {
        frontTitleEl.className = "en-word";
        frontTitleEl.innerText = item.word;
        hintEl.style.display = "none";
        
        document.getElementById("frontPhonetic").innerText = item.phonetic;
        document.getElementById("frontPhonetic").style.display = "block";
        document.getElementById("frontSub").innerText = item.pos;
        
        backTitleEl.className = "ja-word";
        backTitleEl.innerText = item.meaning;
        
        document.getElementById("backPhonetic").style.display = "none";
        document.getElementById("backExample").innerText = `"${item.example}"`;
      } else {
        frontTitleEl.className = "ja-word";
        frontTitleEl.innerText = item.meaning;
        
        let w = item.word;
        let firstChar = w.charAt(0);
        let restChars = w.slice(1).replace(/[a-zA-Z]/g, " _");
        let letterCount = w.replace(/[^a-zA-Z]/g, '').length;
        
        hintEl.innerText = `Hint: ${firstChar}${restChars} (${letterCount} letters)`;
        hintEl.style.display = "block";
        
        document.getElementById("frontPhonetic").style.display = "none";
        document.getElementById("frontSub").innerText = item.pos;
        
        backTitleEl.className = "en-word";
        backTitleEl.innerText = item.word;
        
        document.getElementById("backPhonetic").innerText = item.phonetic;
        document.getElementById("backPhonetic").style.display = "block";
        document.getElementById("backExample").innerText = `"${item.example}"`;
      }

      document.getElementById("frontBadge").innerText = item.cefr;
      document.getElementById("frontBadge").className = `badge ${item.cefr}`;
      document.getElementById("backSrc").innerText = `出典: ${item.src}`;
      document.getElementById("backBadge").innerText = item.cefr;
      document.getElementById("backBadge").className = `badge ${item.cefr}`;

      const cardEl = document.getElementById("card");
      cardEl.classList.remove("flipped");
      isFlipped = false;

      updateDashboardUI();
    }

    function updateDashboardUI() {
      document.getElementById("currentCardNum").innerText = filteredList.length > 0 ? currentIndex + 1 : 0;
      document.getElementById("totalCardNum").innerText = filteredList.length;
      document.getElementById("masteredCount").innerText = masteredIds.length;

      const percent = Math.round((masteredIds.length / vocabulary.length) * 100);
      document.getElementById("percentText").innerText = `${percent}%`;
      const circleProgress = document.getElementById("circleProgress");
      circleProgress.style.strokeDasharray = `${percent}, 100`;
    }

    function setupQuiz() {
      if (filteredList.length === 0) {
        document.getElementById("quizQuestion").innerText = "問題がありません";
        document.getElementById("optionsGrid").innerHTML = "";
        return;
      }

      const currentItem = filteredList[currentIndex];
      const mode = document.getElementById("modeSelect").value;
      const quizQuestionEl = document.getElementById("quizQuestion");

      document.getElementById("quizBadge").innerText = currentItem.cefr;
      document.getElementById("quizBadge").className = `badge ${currentItem.cefr}`;
      
      if (mode === "EN_JA") {
        quizQuestionEl.className = "quiz-question en-word-quiz";
        quizQuestionEl.innerText = currentItem.word;
      } else {
        quizQuestionEl.className = "quiz-question ja-word-quiz";
        quizQuestionEl.innerText = currentItem.meaning;
      }

      let options = [currentItem];
      let pool = vocabulary.filter(v => v.id !== currentItem.id);
      
      pool.sort(() => 0.5 - Math.random());
      options.push(...pool.slice(0, 3));
      options.sort(() => 0.5 - Math.random());

      const grid = document.getElementById("optionsGrid");
      grid.innerHTML = "";

      options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = mode === "EN_JA" ? opt.meaning : opt.word;
        btn.onclick = () => checkAnswer(btn, opt.id === currentItem.id);
        grid.appendChild(btn);
      });

      updateDashboardUI();

      if (isAudioEnabled) {
        speakSide(null, 'front');
      }
    }

    function checkAnswer(selectedBtn, isCorrect) {
      const allBtns = document.querySelectorAll(".option-btn");
      allBtns.forEach(b => b.disabled = true);

      let waitTime = 1200; // 正解時の移動待ち時間 (1.2秒)

      if (isCorrect) {
        selectedBtn.classList.add("correct");
        markCard(true, true);
      } else {
        selectedBtn.classList.add("wrong");
        const currentItem = filteredList[currentIndex];
        const mode = document.getElementById("modeSelect").value;
        const targetText = mode === "EN_JA" ? currentItem.meaning : currentItem.word;
        allBtns.forEach(b => {
          if (b.innerText === targetText) b.classList.add("correct");
        });
        waitTime = 3000; // 不正解時は正解確認・思考時間として3秒確保
      }

      setTimeout(() => {
        if (filteredList.length === 0) return;
        currentIndex = (currentIndex + 1) % filteredList.length;
        if (currentView === 'quiz') {
          setupQuiz();
        } else {
          updateCard();
        }
      }, waitTime);
    }

    function flipCardAnimation() {
      if (filteredList.length === 0) return;
      const cardEl = document.getElementById("card");
      isFlipped = !isFlipped;
      cardEl.classList.toggle("flipped", isFlipped);
    }

    function manualFlipCard() {
      if (isAutoplay) stopAutoplay();
      flipCardAnimation();
      if (isAudioEnabled) {
        setTimeout(() => {
          speakSide(null, isFlipped ? 'back' : 'front');
        }, 400);
      }
    }

    function nextCard() {
      if (filteredList.length === 0) return;
      if (isAutoplay) stopAutoplay();
      currentIndex = (currentIndex + 1) % filteredList.length;
      if (currentView === 'quiz') {
        setupQuiz();
      } else {
        updateCard();
        if (isAudioEnabled) speakSide(null, 'front');
      }
    }

    function prevCard() {
      if (filteredList.length === 0) return;
      if (isAutoplay) stopAutoplay();
      currentIndex = (currentIndex - 1 + filteredList.length) % filteredList.length;
      if (currentView === 'quiz') {
        setupQuiz();
      } else {
        updateCard();
        if (isAudioEnabled) speakSide(null, 'front');
      }
    }

    function markCard(mastered, skipNav = false) {
      if (filteredList.length === 0) return;
      const item = filteredList[currentIndex];

      if (mastered) {
        if (!masteredIds.includes(item.id)) masteredIds.push(item.id);
      } else {
        masteredIds = masteredIds.filter(id => id !== item.id);
      }
      saveState();
      
      if (!skipNav) {
        nextCard();
      }
    }

    function filterCards() {
      const selectedLesson = document.getElementById("lessonFilter").value;
      const selectedLevel = document.getElementById("levelFilter").value;

      filteredList = vocabulary.filter(item => {
        let lessonMatch = false;
        if (selectedLesson === "ALL") {
          lessonMatch = true;
        } else if (selectedLesson.includes("-")) {
          const [start, end] = selectedLesson.split("-").map(Number);
          lessonMatch = item.lesson >= start && item.lesson <= end;
        } else {
          lessonMatch = item.lesson === Number(selectedLesson);
        }

        const levelMatch = selectedLevel === "ALL" || item.cefr === selectedLevel;
        return lessonMatch && levelMatch;
      });

      if (isShuffleEnabled) {
        for (let i = filteredList.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [filteredList[i], filteredList[j]] = [filteredList[j], filteredList[i]];
        }
      }

      currentIndex = 0;
      if (currentView === 'quiz') {
        setupQuiz();
      } else {
        updateCard();
      }
    }

    function speakSide(event, side, onEndCallback) {
      if (event) event.stopPropagation();
      
      if (!isAudioEnabled || filteredList.length === 0) {
        if (onEndCallback) onEndCallback();
        return;
      }

      window.speechSynthesis.cancel();

      const item = filteredList[currentIndex];
      const mode = document.getElementById("modeSelect").value;
      const targetLang = document.getElementById("voiceSelect").value;

      let textToSpeak = "";
      let langToUse = "ja-JP";

      if (side === 'front') {
        if (mode === 'EN_JA') {
          textToSpeak = item.word;
          langToUse = targetLang;
        } else {
          textToSpeak = item.meaning;
          langToUse = "ja-JP";
        }
      } else {
        if (mode === 'EN_JA') {
          textToSpeak = item.meaning;
          langToUse = "ja-JP";
        } else {
          textToSpeak = item.word;
          langToUse = targetLang;
        }
      }

      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = langToUse;

      if (langToUse !== "ja-JP") {
        const matchedVoice = availableVoices.find(v => v.lang === langToUse || v.lang.replace('_', '-').startsWith(langToUse));
        if (matchedVoice) utterance.voice = matchedVoice;
      }

      if (onEndCallback) {
        utterance.onend = () => { onEndCallback(); };
        utterance.onerror = () => { onEndCallback(); };
      }

      window.speechSynthesis.speak(utterance);
    }

    function runAutoplayStep() {
      if (!isAutoplay || currentView !== 'card') return;

      const pauseTime = Number(document.getElementById("speedSelect").value) || 3000;
      const item = filteredList[currentIndex];

      if (isFlipped) {
        flipCardAnimation();
      }

      speakSide(null, 'front', () => {
        if (!isAutoplay) return;

        autoplayTimeoutId = setTimeout(() => {
          if (!isAutoplay) return;

          flipCardAnimation();

          autoplayTimeoutId = setTimeout(() => {
            if (!isAutoplay) return;

            speakSide(null, 'back', () => {
              if (!isAutoplay) return;

              let exampleLength = item.example ? item.example.length : 0;
              let readingTime = Math.max(3000, Math.min(7000, exampleLength * 65));

              autoplayTimeoutId = setTimeout(() => {
                if (!isAutoplay) return;
                currentIndex = (currentIndex + 1) % filteredList.length;
                updateCard();
                runAutoplayStep();
              }, readingTime);
            });

          }, 400);

        }, pauseTime);
      });
    }

    function startAutoplaySequence() {
      clearTimeout(autoplayTimeoutId);
      window.speechSynthesis.cancel();
      runAutoplayStep();
    }

    function stopAutoplay() {
      isAutoplay = false;
      const btn = document.getElementById("autoplayBtn");
      btn.classList.remove("autoplay-active");
      btn.innerText = "Auto Play";
      clearTimeout(autoplayTimeoutId);
      window.speechSynthesis.cancel();
    }

    function toggleAutoplay() {
      isAutoplay = !isAutoplay;
      const btn = document.getElementById("autoplayBtn");
      if (isAutoplay) {
        btn.classList.add("autoplay-active");
        btn.innerText = "Pause Auto";
        startAutoplaySequence();
      } else {
        stopAutoplay();
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && currentView === 'card') {
        e.preventDefault();
        manualFlipCard();
      } else if (e.code === "ArrowRight") {
        nextCard();
      } else if (e.code === "ArrowLeft") {
        prevCard();
      }
    });

    filterCards();
  </script>
